<!DOCTYPE html>
<html>
<head>
  <title>Flight Log Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <h1>Flight Log Tracker</h1>

  <p>Track your flight hours and aircraft.</p>
  <div class="form-section">
  <input type="date" id="date">

  <input type="text" id="aircraft" placeholder="Aircraft Type">

  <input type="text" id="aircraftIdent" placeholder="Aircraft Ident.">

  <input type="text" id="from" placeholder="From">

  <input type="text" id="to" placeholder="To">

  <input type="number" id="hours" placeholder="Flight Hours" step="0.1">
  
  <input type="text" id="remarks" placeholder="Remarks">

  <button onclick="addFlight()">Add Flight</button>
  </div>

<h2>Flight Entries</h2>

<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Aircraft</th>
      <th>Aircraft Ident.</th>
      <th>From</th>
      <th>To</th>
      <th>Hours</th>
      <th>Remarks</th>
      <th>Delete</th>
    </tr>
  </thead>
  <tbody id="flightTable">
  </tbody>
</table>

<h3>Total Hours: <span id="totalHours">0</span></h3>

<script src="script.js"></script>
</body>
</html>
